<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterCord — 24/7 Bot Hosting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card: rgba(20, 22, 34, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #5865F2;
      --accent-glow: rgba(88, 101, 242, 0.45);
      --success: #23a559;
      --danger: #da373c;
      --warning: #f0b232;
      --text: #f2f3f5;
      --muted: #949ba4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.25rem;
      overflow-x: hidden;
      position: relative;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      z-index: -1;
      opacity: 0.45;
      animation: float 14s ease-in-out infinite alternate;
    }
    .orb-1 { width: 420px; height: 420px; background: #5865F2; top: -100px; left: -100px; }
    .orb-2 { width: 360px; height: 360px; background: #9b59b6; bottom: -80px; right: -80px; animation-delay: -5s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.12); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.5; }
    }

    .container {
      width: 100%;
      max-width: 720px;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    header { text-align: center; margin-bottom: 2.5rem; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(88, 101, 242, 0.14);
      border: 1px solid rgba(88, 101, 242, 0.35);
      color: #a5b4fc;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .badge span {
      width: 8px; height: 8px; border-radius: 50%;
      background: #23a559; animation: pulseDot 2s infinite;
    }

    h1 {
      font-size: 2.4rem; font-weight: 700; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p { color: var(--muted); font-size: 1rem; }

    .glass-card {
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.75rem;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
      margin-bottom: 2rem;
    }

    .input-group { display: flex; flex-direction: column; gap: 0.9rem; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    input {
      flex: 1; min-width: 220px;
      background: rgba(10, 11, 18, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button {
      cursor: pointer; border: none; border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600; font-size: 0.95rem; padding: 0.9rem 1.5rem;
      transition: transform 0.18s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent); color: #fff;
      box-shadow: 0 8px 20px var(--accent-glow);
      width: 100%;
    }
    .btn-primary:hover { background: #4752c4; transform: translateY(-2px); }

    .section-title {
      font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin-bottom: 1rem;
      display: flex; justify-content: space-between; align-items: center;
    }

    .bot-list { display: flex; flex-direction: column; gap: 0.85rem; }

    .bot-item {
      background: rgba(14, 16, 26, 0.85);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 1.1rem 1.25rem;
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; animation: slideUp 0.35s ease;
    }

    .bot-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }

    .bot-name { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 8px; }

    .status-pill { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; text-transform: uppercase; }
    .status-running { background: rgba(35, 165, 89, 0.18); color: #4ade80; border: 1px solid rgba(35, 165, 89, 0.35); }
    .status-deploying { background: rgba(240, 178, 50, 0.18); color: #facc15; border: 1px solid rgba(240, 178, 50, 0.35); }
    .status-stopped { background: rgba(218, 55, 60, 0.18); color: #f87171; border: 1px solid rgba(218, 55, 60, 0.35); }
    .status-error { background: rgba(218, 55, 60, 0.25); color: #fca5a5; border: 1px solid rgba(218, 55, 60, 0.5); }

    .token-preview { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--muted); }
    .error-text { font-size: 0.78rem; color: #f87171; font-weight: 500; margin-top: 2px; }

    .actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .btn-stop { background: rgba(218, 55, 60, 0.16); color: #f87171; border: 1px solid rgba(218, 55, 60, 0.3); padding: 0.55rem 0.95rem; font-size: 0.82rem; }
    .btn-stop:hover { background: var(--danger); color: #fff; }
    .btn-start { background: rgba(35, 165, 89, 0.16); color: #4ade80; border: 1px solid rgba(35, 165, 89, 0.3); padding: 0.55rem 0.95rem; font-size: 0.82rem; }
    .btn-start:hover { background: var(--success); color: #fff; }
    .btn-delete { background: rgba(255, 255, 255, 0.05); color: var(--muted); padding: 0.55rem 0.8rem; font-size: 0.82rem; }
    .btn-delete:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.92rem; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <header>
      <div class="badge"><span></span> Cloud Worker Synced</div>
      <h1>BetterCord Host</h1>
      <p>Deploy your Discord bot token and keep it online 24/7 automatically.</p>
    </header>

    <div class="glass-card">
      <form id="botForm" class="input-group">
        <div class="row">
          <input type="password" id="botToken" placeholder="Paste Discord Bot Token here..." required />
        </div>
        <button type="submit" class="btn-primary">Launch Bot 24/7</button>
      </form>
    </div>

    <div class="glass-card">
      <div class="section-title">
        <span>Your Deployed Bots</span>
        <span id="botCount">0 Active</span>
      </div>
      <div id="botList" class="bot-list">
        <div class="empty-state">Connecting to database...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB5aAwZNWcJEbVBUXu3S_Q68drt1mZ20bE",
      authDomain: "bettercord-52166.firebaseapp.com",
      databaseURL: "https://bettercord-52166-default-rtdb.firebaseio.com",
      projectId: "bettercord-52166",
      storageBucket: "bettercord-52166.firebasestorage.app",
      messagingSenderId: "31822010107",
      appId: "1:31822010107:web:fb7a95036abe214e0d425e",
      measurementId: "G-83JVF5WXP4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const botsRef = ref(db, "bots");

    const botForm = document.getElementById("botForm");
    const botList = document.getElementById("botList");
    const botCount = document.getElementById("botCount");

    function maskToken(token) {
      if (!token || token.length < 12) return "••••••••••••";
      return `${token.slice(0, 6)}••••••••••••${token.slice(-4)}`;
    }

    botForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = document.getElementById("botToken").value.trim();
      if (!token) return;

      // Automatically generate a clean label using the first few chars of the token
      const autoLabel = `Bot (${token.slice(0, 6)}...)`;

      await push(botsRef, {
        label: autoLabel,
        token: token,
        status: "deploying",
        botUsername: "Initializing...",
        errorMessage: "",
        createdAt: Date.now()
      });

      botForm.reset();
    });

    onValue(botsRef, (snapshot) => {
      const data = snapshot.val();
      botList.innerHTML = "";

      if (!data) {
        botCount.textContent = "0 Active";
        botList.innerHTML = `<div class="empty-state">No bots deployed yet. Paste a token above to start!</div>`;
        return;
      }

      const entries = Object.entries(data);
      const runningCount = entries.filter(([, b]) => b.status === "running").length;
      botCount.textContent = `${runningCount} / ${entries.length} Online`;

      entries.forEach(([id, bot]) => {
        const status = bot.status || "stopped";
        const isRunning = status === "running";
        const isDeploying = status === "deploying";
        const isError = status === "error";

        let pillClass = "status-stopped";
        let pillText = "Stopped";
        if (isRunning) { pillClass = "status-running"; pillText = "Running 24/7"; }
        else if (isDeploying) { pillClass = "status-deploying"; pillText = "Deploying..."; }
        else if (isError) { pillClass = "status-error"; pillText = "Error"; }

        const item = document.createElement("div");
        item.className = "bot-item";

        item.innerHTML = `
          <div class="bot-info">
            <div class="bot-name">
              <span>${bot.label}</span>
              <span class="status-pill ${pillClass}">${pillText}</span>
            </div>
            <div class="token-preview">
              Discord: <strong>${bot.botUsername || "Pending"}</strong> • Token: ${maskToken(bot.token)}
            </div>
            ${isError && bot.errorMessage ? `<div class="error-text">⚠️ ${bot.errorMessage}</div>` : ""}
          </div>
          <div class="actions">
            ${
              isRunning || isDeploying
                ? `<button class="btn-stop" data-action="stop" data-id="${id}">Stop Bot</button>`
                : `<button class="btn-start" data-action="start" data-id="${id}">Start Bot</button>`
            }
            <button class="btn-delete" data-action="delete" data-id="${id}" title="Remove">✕</button>
          </div>
        `;
        botList.appendChild(item);
      });
    });

    botList.addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      const id = btn.dataset.id;
      const action = btn.dataset.action;
      const itemRef = ref(db, `bots/${id}`);

      if (action === "stop") {
        await update(itemRef, { status: "stopped", botUsername: "Stopped by user", errorMessage: "" });
      } else if (action === "start") {
        await update(itemRef, { status: "deploying", botUsername: "Re-deploying...", errorMessage: "" });
      } else if (action === "delete") {
        await remove(itemRef);
      }
    });
  </script>
</body>
</html>
